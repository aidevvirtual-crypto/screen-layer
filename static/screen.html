<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Screen Layer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
               font-family: system-ui, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #marker { position: fixed; inset: 0; background: #fff; display: none; align-items: center; justify-content: center; }
  #marker img { image-rendering: pixelated; }
  #marker span { position: absolute; bottom: 8px; color: #000; font-size: 14px; }
  #join, #settings { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
                     align-items: center; justify-content: center; background: rgba(0,0,0,.85); text-align: center; padding: 16px; }
  #settings { display: none; }
  button, input { font-size: 18px; padding: 10px 18px; border-radius: 10px; border: 0; }
  button { background: #3a7bff; color: #fff; }
  #gear { position: fixed; top: 6px; right: 6px; background: rgba(255,255,255,.12); padding: 6px 10px; font-size: 16px; }
  #idtag { position: fixed; top: 10px; left: 10px; font-size: 12px; opacity: .5; }
  small { opacity: .7; max-width: 320px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="idtag"></div>
<button id="gear">⚙</button>
<div id="marker"><img id="mimg" alt=""><span id="mlabel"></span></div>
<div id="join">
  <h2 style="margin:0">Screen Layer</h2>
  <button id="go">Gabung</button>
  <small>Letakkan perangkat di meja. Ketuk dua kali di layar untuk menampilkan atau menyembunyikan marker tracking.</small>
</div>
<div id="settings">
  <div>Perangkat <b id="sid"></b></div>
  <label>Lebar layar fisik (cm, kosongkan = otomatis dari kamera)<br>
    <input id="wcm" type="number" step="0.1" inputmode="decimal" style="width:120px;margin-top:8px"></label>
  <label><input id="snd" type="checkbox"> Suara</label>
  <button id="close">Tutup</button>
</div>
<video id="v" src="/video" playsinline muted loop preload="auto" crossorigin="anonymous" style="display:none"></video>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), video = $('v');
const key = localStorage.slKey || (localStorage.slKey = Math.random().toString(36).slice(2));
let myId = null, markerOn = false, motionHide = 0;

const vw = () => innerWidth, vh = () => innerHeight;
const markerPx = () => Math.floor(Math.min(vw(), vh()) * 0.6);

SL.connect(() => ({ t: 'hello', role: 'screen', key, vw: vw(), vh: vh() }), m => {
  if (m.t === 'welcome') {
    myId = m.id; $('idtag').textContent = '#' + myId; $('sid').textContent = '#' + myId;
    $('mimg').src = `/marker/${myId}.png`; $('mlabel').textContent = 'ID ' + myId;
    setMarker(markerOn, true);
  }
});

function setMarker(on, force) {
  if (on === markerOn && !force) return;
  markerOn = on;
  const s = markerPx();
  $('mimg').width = $('mimg').height = s;
  $('marker').style.display = on ? 'flex' : 'none';
  SL.send({ t: 'marker', on, px: s });
}

addEventListener('resize', () => { SL.send({ t: 'size', vw: vw(), vh: vh() }); if (markerOn) setMarker(true, true); });

// double tap toggles the marker
let lastTap = 0;
document.addEventListener('pointerdown', e => {
  if (e.target.closest('#settings,#join,#gear')) return;
  const t = Date.now();
  if (t - lastTap < 350) setMarker(!markerOn);
  lastTap = t;
});

// moving the device shows the marker until it has been still for 1.2s (camera mode only)
function onMotion(e) {
  const a = e.acceleration || {}, r = e.rotationRate || {};
  const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0) + Math.hypot(r.alpha || 0, r.beta || 0, r.gamma || 0) / 40;
  if (mag > 0.6 && SL.state && SL.state.tracking) { setMarker(true); motionHide = Date.now() + 1200; }
}
setInterval(() => { if (motionHide && Date.now() > motionHide) { motionHide = 0; setMarker(false); } }, 100);

$('go').onclick = async () => {
  $('join').style.display = 'none';
  video.play().catch(() => {});
  try { if (DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch (e) {}
  addEventListener('devicemotion', onMotion);
  try { await navigator.wakeLock.request('screen'); } catch (e) {}
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
};
$('gear').onclick = () => { $('settings').style.display = 'flex'; };
$('close').onclick = () => {
  $('settings').style.display = 'none';
  SL.send({ t: 'screenWidth', cm: parseFloat($('wcm').value) || 0 });
  video.muted = !$('snd').checked;
};

setInterval(() => SL.syncVideo(video), 200);

function frame() {
  requestAnimationFrame(frame);
  const dpr = devicePixelRatio || 1, W = vw(), H = vh();
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  const S = SL.state, me = S && myId != null && S.devices[myId];
  if (!me) return;
  const k = me.cmPerPx; // cm per CSS px on this screen
  // table cm -> screen px:  p = R(-a) * (T - C) / k, origin at screen centre
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(W / 2, H / 2);
  ctx.scale(1 / k, 1 / k);
  ctx.rotate(-me.a);
  ctx.translate(-me.x, -me.y);
  SL.drawTable(ctx, video, k);
}
frame();
</script>
</body>
</html>
